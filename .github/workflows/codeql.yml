name: CodeQL

# trigger the workflow on push or pull requests for some paths
on:
  push:
    paths:
    - 'src/**'
    - '.github/workflows/codeql.yml'
    - 'Makefile'
  pull_request:
    paths:
    - 'src/**'
    - '.github/workflows/codeql.yml'
    - 'Makefile'

jobs:
  CodeQL-Build:
    runs-on: ubuntu-24.04     # GitHub Runner
    container: ubuntu:24.04   # Docker Hub container

    steps:
    - name: Check out repository
      uses: actions/checkout@v5

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: cpp
        queries: +security-and-quality

    - name: Install dependencies
      run: |
        apt-get -y update
        apt-get -y --allow-unauthenticated --allow-downgrades --allow-remove-essential --allow-change-held-packages \
          install make gcc libevent-dev libmsgpack-dev git

    - name: Autobuild
      uses: github/codeql-action/autobuild@v4

    - name: CodeQL Analysis
      uses: github/codeql-action/analyze@v4
